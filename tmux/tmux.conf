# Enable 256-color and true-color (24-bit) support in tmux
set -g default-terminal "screen-256color" # Set terminal type for 256-color support
set -ga terminal-overrides ",*256col*:Tc" # Override to enable true-color for compatible terminals

# General
set -g set-clipboard on         # Use system clipboard
set -g detach-on-destroy off    # Don't exit from tmux when closing a session
set -g escape-time 0            # Remove delay for exiting insert mode with ESC in Neovim
set -g history-limit 1000000    # Increase history size (from 2,000)
set -g mouse on                 # Enable mouse support
set -g status-interval 25        # Update the status bar every 3 seconds (default: 15 seconds)
# set -g allow-passthrough on   # Allow programs in the pane to bypass tmux (e.g. for image preview)
set -g status-position top      # Status bar on top of the screen
set-option -g display-time 4000 # Allow message bar to stay visible for 4 seconds

# Set prefix key
unbind C-b              # Unbind the default prefix key
set -g prefix C-z   # Set new prefix key to Ctrl+z

# Refresh tmux config with r
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Split vertically in CWD with -
unbind "%" 
bind "\\" split-window -h -c "#{pane_current_path}"  

# Split horizontally (30%) in CWD with \
unbind '"' 
bind - split-window -v -c "#{pane_current_path}" -p 30

# New window in same path
bind c new-window -c "#{pane_current_path}"

# Use vim arrow keys to resize
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Use m key to maximize pane
bind -r m resize-pane -Z

# Enable vi mode to allow us to use vim keys to move around in copy mode (Prefix + [ places us in copy mode)
set-window-option -g mode-keys vi

# Start selecting text with "v"
bind-key -T copy-mode-vi 'v' send -X begin-selection 

# Copy text with "y"
bind -T copy-mode-vi 'y' send-keys -X copy-pipe-and-cancel "pbcopy"

# Paste yanked text with "Prefix + P" ("Prefix + p" goes to previous window)
bind P paste-buffer
 
# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on # Automatically renumber windows when one is closed

# tpm plugin manager
set -g @plugin 'tmux-plugins/tpm'

# List of tmux plugins
# set -g @plugin 'christoomey/vim-tmux-navigator' # Enable navigating between nvim and tmux
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor' # CPU and memory info
set -g @plugin 'tmux-plugins/tmux-yank'         # Use operating system copy and paste
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum'    # Automatically saves sessions every 15 minutes
set -g @plugin 'xamut/tmux-weather'             # Show weather on top status bar
set -g @plugin 'xamut/tmux-network-bandwidth'   # Show banwidth on top status bar 

# color definitions
gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"

# Styling
set -g status-left-length 100
set -g status-right-length 150
set -g status-style "fg=${gray_light},bg=${gray_dark}"
set -g status-left "#[fg=${green_soft},bold]  #S #[fg=${gray_light},nobold] | "
set -g status-right "  #{cpu}    #{mem} | #{network_bandwidth} | #{weather} |  #(date +'%d %b %A %H:%M:%S  ')"
set -g window-status-current-format "#[fg=${cyan_soft},bold]  #[underscore]#I:#W"
set -g message-style "fg=${gray_light}, bg=${gray_dark}"
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"
set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "fg=${gray_medium}"

# Weather config
set-option -g @tmux-weather-interval 5
set-option -g @tmux-weather-location "Greenwich,UK" 

# Resurrect
# To save nvim status we have to use :mksession that stores a Session.vim file in the root of the project. This file will then be used by resurrect.
# To save a session <prefix>Ctlr+s and to recover <prefix>Ctlr+r
resurrect_dir="$HOME/.tmux/resurrect"
set -g @resurrect-dir $resurrect_dir
set -g @resurrect-strategy-nvim 'session'
# set -g @resurrect-capture-pane-contents 'on' # Commented out because it adds an extra prompt at the bottom
set -g @continuum-restore 'on'
# Resurrect files call nvim using the snap path (/snap/nvim/4362/usr/bin/nvim) and this does not work, we replace it with only "nvim" every 
# time resurrect saves the state
set -g @resurrect-hook-post-save-all 'target=$(readlink -f $resurrect_dir/last); sed -i "s|/snap/nvim/4362/usr/bin/||g" $target '

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# NOTE:
# - To apply theme changes: tmux kill-server && rm -rf /tmp/tmux-*
# - To avoid overlap, disable the Mac shortcut to switch input sources with Ctrl+Space in `System settings > Keyboard Shortcuts > Input Sources`
